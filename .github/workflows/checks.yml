name: Check and notify distribution

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run validate
      - run: npm test
      - run: npm run check
      - name: Pull request distribution status
        if: github.event_name == 'pull_request'
        run: echo '::notice::Pull request checks only; downstream notification is disabled.'

  notify:
    needs: checks
    outputs:
      stable: ${{ steps.release.outputs.stable }}
      sha: ${{ steps.release.outputs.sha }}
    if: github.event_name == 'push' && github.repository == 'asaubhagya/meetly-skills' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve stable release and peel tag to commit
        id: release
        shell: bash
        run: |
          echo "sha=$(git rev-parse 'HEAD^{commit}')" >> "$GITHUB_OUTPUT"
          node --input-type=module -e 'import { appendFileSync } from "node:fs"; const stable = /^refs\/tags\/v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(process.env.GITHUB_REF); appendFileSync(process.env.GITHUB_OUTPUT, `stable=${stable}\n`);'
      - name: Notify website after successful checks
        env:
          MEETLY_AGENTS_DEPLOY_HOOK: ${{ secrets.MEETLY_AGENTS_DEPLOY_HOOK }}
          MEETLY_DISTRIBUTION_TOKEN: ${{ secrets.MEETLY_DISTRIBUTION_TOKEN }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ steps.release.outputs.sha }}
        run: node scripts/notify-distribution.mjs

  promote-plugin:
    needs: [checks, notify]
    if: github.event_name == 'push' && github.repository == 'asaubhagya/meetly-skills' && needs.notify.outputs.stable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: meetly-plugin-stable-promotion
      cancel-in-progress: false
    env:
      EXPECTED_SKILLS_SHA: ${{ needs.notify.outputs.sha }}
    steps:
      - name: Require scoped plugin deploy key
        env:
          PLUGIN_KEY: ${{ secrets.MEETLY_PLUGIN_DEPLOY_KEY }}
        run: node -e 'if (!process.env.PLUGIN_KEY) { console.error("MEETLY_PLUGIN_DEPLOY_KEY is required for stable plugin promotion; configure a write deploy key scoped only to meetly-plugin."); process.exit(1); }'
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait up to ten minutes for website latest
        run: node scripts/wait-for-latest.mjs
      - name: Check out private plugin main with its scoped deploy key
        uses: actions/checkout@v4
        with:
          repository: asaubhagya/meetly-plugin
          ref: main
          path: plugin
          ssh-key: ${{ secrets.MEETLY_PLUGIN_DEPLOY_KEY }}
          ssh-strict: true
      - name: Install pinned plugin dependencies
        working-directory: plugin
        run: npm ci --ignore-scripts
      - name: Hydrate, verify, and commit generated plugin files
        run: node scripts/promote-plugin.mjs plugin
