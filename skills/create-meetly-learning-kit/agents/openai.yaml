interface:
  display_name: "Create Meetly Learning Kit"
  short_description: "Turn lectures into notes and retrieval practice"
  brand_color: "#ED5A36"
  default_prompt: "Use $create-meetly-learning-kit to turn my latest lecture into structured notes and a quiz."
dependencies:
  tools:
    - type: "mcp"
      value: "meetly"
      description: "Retrieve authorized Meetly learning evidence"
      transport: "streamable_http"
      url: "https://mcp.getmeetly.ai/mcp"
policy:
  allow_implicit_invocation: false
