interface:
  display_name: "Create a PRD"
  short_description: "Turn product conversations into grounded requirements"
  brand_color: "#151515"
  default_prompt: "Use $create-meetly-prd to create a PRD from my product discussion."
dependencies:
  tools:
    - type: "mcp"
      value: "meetly"
      description: "Retrieve authorized Meetly transcript evidence and preferences"
      transport: "streamable_http"
      url: "https://mcp.getmeetly.ai/mcp"
policy:
  allow_implicit_invocation: false
