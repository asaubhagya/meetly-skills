interface:
  display_name: "Create Meetly Product Docs"
  short_description: "Turn discussions into grounded product specs"
  brand_color: "#111111"
  default_prompt: "Use $create-meetly-product-docs to turn our latest brainstorm into a clear product and engineering spec."
dependencies:
  tools:
    - type: "mcp"
      value: "meetly"
      description: "Retrieve and render authorized Meetly product evidence"
      transport: "streamable_http"
      url: "https://mcp.getmeetly.ai/mcp"
policy:
  allow_implicit_invocation: true
