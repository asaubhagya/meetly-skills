interface:
  display_name: "Create Meetly Research Brief"
  short_description: "Investigate meeting claims with external sources"
  brand_color: "#ED5A36"
  default_prompt: "Use $create-meetly-research-brief to investigate the open claims from my latest strategy discussion."
dependencies:
  tools:
    - type: "mcp"
      value: "meetly"
      description: "Retrieve authorized Meetly research context"
      transport: "streamable_http"
      url: "https://mcp.getmeetly.ai/mcp"
policy:
  allow_implicit_invocation: false
