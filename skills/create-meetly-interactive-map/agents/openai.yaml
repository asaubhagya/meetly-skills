interface:
  display_name: "Create Meetly Interactive Map"
  short_description: "Map meeting ideas into interactive HTML"
  brand_color: "#ED5A36"
  default_prompt: "Use $create-meetly-interactive-map to map the concepts and evidence from my latest discussion."
dependencies:
  tools:
    - type: "mcp"
      value: "meetly"
      description: "Retrieve authorized Meetly evidence for a visual map"
      transport: "streamable_http"
      url: "https://mcp.getmeetly.ai/mcp"
policy:
  allow_implicit_invocation: false
