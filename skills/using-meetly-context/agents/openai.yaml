interface:
  display_name: "Use Meetly Context"
  short_description: "Retrieve grounded meeting evidence safely"
  brand_color: "#111111"
  default_prompt: "Use $using-meetly-context to answer from my authorized Meetly meetings with speaker evidence."
dependencies:
  tools:
    - type: "mcp"
      value: "meetly"
      description: "Retrieve authorized Meetly meeting context and interactive artifacts"
      transport: "streamable_http"
      url: "https://mcp.getmeetly.ai/mcp"
policy:
  allow_implicit_invocation: true
