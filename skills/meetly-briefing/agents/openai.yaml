interface:
  display_name: "Daily Executive Brief"
  short_description: "Your daily newspaper of insights and learning"
  brand_color: "#151515"
  default_prompt: "Use $meetly-briefing to brief me on my recorded meetings today."
dependencies:
  tools:
    - type: "mcp"
      value: "meetly"
      description: "Retrieve authorized Meetly transcript evidence"
      transport: "streamable_http"
      url: "https://mcp.getmeetly.ai/mcp"
policy:
  allow_implicit_invocation: true
