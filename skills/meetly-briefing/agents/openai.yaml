interface:
  display_name: "Meetly Briefing"
  short_description: "Catch up across meetings with clear coverage"
  brand_color: "#ED5A36"
  default_prompt: "Use $meetly-briefing to brief me on my meetings this week and disclose any gaps."
dependencies:
  tools:
    - type: "mcp"
      value: "meetly"
      description: "Retrieve authorized Meetly meeting evidence"
      transport: "streamable_http"
      url: "https://mcp.getmeetly.ai/mcp"
policy:
  allow_implicit_invocation: true
