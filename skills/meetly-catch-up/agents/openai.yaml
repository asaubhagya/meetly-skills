interface:
  display_name: "Meetly Catch-up"
  short_description: "Catch up with grounded meeting insights"
  brand_color: "#ED5A36"
  default_prompt: "Use $meetly-catch-up to catch me up on my latest meeting and surface the important insights."
dependencies:
  tools:
    - type: "mcp"
      value: "meetly"
      description: "Retrieve authorized Meetly meeting context"
      transport: "streamable_http"
      url: "https://mcp.getmeetly.ai/mcp"
policy:
  allow_implicit_invocation: true
